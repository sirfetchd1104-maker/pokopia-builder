<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokopia Builder — Guide</title>
    <meta name="description" content="Pokopia Builder usage guide. Learn how to use all features including 14 block types, batch placement, symmetry, box select, pixel art, and more." />
    <meta name="theme-color" content="#151719" />
    <link rel="icon" href="./src/images/favicon.png" type="image/png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      html, body {
        margin: 0;
        padding: 0;
        background: #151719;
        color: #eef3f0;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        line-height: 1.7;
      }

      /* ── Header ── */
      .guide-header {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 24px;
        background: rgba(21, 23, 25, 0.92);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
      }
      .guide-header a {
        color: #a78bcc;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }
      .guide-header a:hover { text-decoration: underline; }
      .guide-header select {
        padding: 4px 8px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 6px;
        background: rgba(255,255,255,0.06);
        color: #eef3f0;
        font-size: 13px;
        cursor: pointer;
      }
      .guide-header select option {
        color: rgb(48, 48, 48);
      }

      /* ── Main ── */
      .guide-main {
        max-width: 800px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }
      .guide-main > h1 {
        margin: 0 0 28px;
        font-size: 24px;
        font-weight: 700;
        color: #eef3f0;
      }

      /* ── TOC ── */
      #guideToc {
        margin-bottom: 36px;
        padding: 16px 20px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        background: rgba(255,255,255,0.03);
      }
      #guideToc h2 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
        color: #a78bcc;
      }
      #guideToc ul {
        margin: 0;
        padding-left: 18px;
        list-style: none;
      }
      #guideToc li { margin: 4px 0; }
      #guideToc a {
        color: #ccd4cf;
        text-decoration: none;
        font-size: 13px;
        transition: color 120ms;
      }
      #guideToc a:hover { color: #a78bcc; }

      /* ── Sections ── */
      .guide-section {
        margin-bottom: 36px;
        padding: 20px 24px;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        background: rgba(255,255,255,0.02);
      }
      .guide-section h2 {
        margin: 0 0 14px;
        font-size: 17px;
        font-weight: 700;
        color: #a78bcc;
        border-bottom: 1px solid rgba(167,139,204,0.2);
        padding-bottom: 8px;
      }
      .guide-section h4 {
        margin: 18px 0 8px;
        font-size: 14px;
        font-weight: 600;
        color: #ccd4cf;
      }
      .guide-section p {
        margin: 0 0 12px;
        color: #bcc4bf;
      }
      .guide-section ul {
        margin: 0 0 12px;
        padding-left: 20px;
      }
      .guide-section li {
        margin: 4px 0;
        color: #bcc4bf;
      }
      .guide-section strong { color: #eef3f0; }

      /* ── Tables ── */
      .guide-table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0 16px;
        font-size: 13px;
      }
      .guide-table th {
        text-align: left;
        padding: 8px 12px;
        background: rgba(167,139,204,0.1);
        color: #a78bcc;
        font-weight: 600;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .guide-table td {
        padding: 7px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        color: #ccd4cf;
      }
      .guide-table tr:last-child td { border-bottom: none; }

      /* ── kbd ── */
      kbd {
        display: inline-block;
        min-width: 22px;
        padding: 2px 6px;
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 4px;
        background: rgba(255,255,255,0.08);
        color: #eef3f0;
        font-family: inherit;
        font-size: 12px;
        text-align: center;
        line-height: 1.4;
      }

      /* ── Block Grid ── */
      .guide-blocks-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
        margin: 8px 0;
      }
      .guide-block-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 14px 10px;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        background: rgba(255,255,255,0.03);
        text-align: center;
      }
      .guide-block-card svg { color: #a78bcc; }
      .guide-block-card strong {
        font-size: 13px;
        color: #eef3f0;
      }
      .guide-block-desc {
        font-size: 11px;
        color: #8a9490;
        line-height: 1.4;
      }

      /* ── Footer ── */
      .guide-footer {
        text-align: center;
        padding: 24px;
        font-size: 12px;
        color: rgba(255,255,255,0.3);
        border-top: 1px solid rgba(255,255,255,0.06);
      }

      /* ── Mobile ── */
      @media (max-width: 600px) {
        .guide-main { padding: 20px 14px 60px; }
        .guide-main > h1 { font-size: 20px; }
        .guide-section { padding: 16px; }
        .guide-blocks-grid { grid-template-columns: repeat(2, 1fr); }
        .guide-table { font-size: 12px; }
        .guide-table th, .guide-table td { padding: 6px 8px; }
      }
    </style>
  </head>
  <body>
    <header class="guide-header">
      <a id="guideBackLink" href="./index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>Back to App</a>
      <select id="guideLangSelect">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </header>

    <main class="guide-main">
      <h1 id="guidePageTitle">Pokopia Builder User Guide</h1>
      <nav id="guideToc"></nav>
      <div id="guideContent"></div>
    </main>

    <footer class="guide-footer">
      © 2026 Pokopia Builder · sirfetchd1104@gmail.com
    </footer>

    <script type="module" src="./src/guide.js"></script>
  </body>
</html>
